<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Razão · Gestão Administrativa</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="brand" style="justify-content:center; padding-bottom:18px;">
      <span class="brand-mark">R</span>
      <div class="brand-text" style="align-items:flex-start;">
        <strong>Razão</strong>
        <small>Gestão Administrativa</small>
      </div>
    </div>
    <div id="auth-body"><!-- injetado via JS --></div>
  </div>
</div>

<div id="app" class="is-hidden">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">R</span>
      <div class="brand-text">
        <strong>Empresa X</strong>
        <small>Gestão Administrativa</small>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item is-active" data-tab="dashboard">
        <svg viewBox="0 0 24 24"><path d="M3 13h4v8H3zM10 4h4v17h-4zM17 9h4v12h-4z"/></svg>
        Painel inicial
      </button>
      <button class="nav-item" data-tab="fornecedores">
        <svg viewBox="0 0 24 24"><path d="M3 21V8l9-5 9 5v13h-6v-6H9v6z"/></svg>
        Fornecedores
      </button>
      <button class="nav-item" data-tab="clientes">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>
        Clientes
      </button>
      <button class="nav-item" data-tab="agenda">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
        Agenda
      </button>
      <button class="nav-item" data-tab="bancos">
        <svg viewBox="0 0 24 24"><path d="M3 10l9-6 9 6v2H3zM4 12h2v7H4zM9 12h2v7H9zM13 12h2v7h-2zM18 12h2v7h-2zM3 21h18v2H3z"/></svg>
        Contas Bancárias
      </button>
      <button class="nav-item" data-tab="pagar">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 9h16M8 14h4"/></svg>
        Contas a Pagar
      </button>
      <button class="nav-item" data-tab="receber">
        <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        Contas a Receber
      </button>
      <button class="nav-item" data-tab="cartoes">
        <svg viewBox="0 0 24 24"><path d="M3 6h18v12H3zM3 10h18M6 15h4"/></svg>
        Cartões de Crédito
      </button>
      <button class="nav-item" data-tab="relatorios">
        <svg viewBox="0 0 24 24"><path d="M5 20V10M11 20V4M17 20v-7"/></svg>
        Relatórios
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="mini-balance">
        <span>Usuário</span>
        <strong id="current-user-label" style="font-size:14px;">—</strong>
      </div>
      <button class="ghost-btn" data-action="logout">Sair</button>
      <div class="mini-balance">
        <span>Saldo em contas</span>
        <strong id="sidebar-saldo">R$ 0,00</strong>
      </div>
      <button class="ghost-btn" id="btn-export">Exportar dados</button>
      <button class="ghost-btn" id="btn-import">Importar dados</button>
      <button class="ghost-btn" id="btn-reset" style="border-color:var(--debit); color:#F3D3CB;">Limpar dados</button>
      <input type="file" id="file-import" accept="application/json" hidden>
    </div>
  </aside>

  <main class="content">
    <header class="topbar">
      <h1 id="page-title">Painel</h1>
      <div class="topbar-chips" id="topbar-chips"></div>
    </header>

    <section id="tab-content" class="tab-content">
      <!-- injetado via JS -->
    </section>
  </main>

</div>

<div id="modal-overlay" class="modal-overlay" hidden>
  <div class="modal" id="modal-box">
    <button class="modal-close" id="modal-close">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
